<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Nilai Per Kelas</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2pdf for downloading formatted PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="loading-overlay" class="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center p-4 transition-opacity duration-300">
        <div class="text-center space-y-4 max-w-sm">
            <div id="loading-spinner-box">
                <img src="https://media.tenor.com/pgO8hZgOW5AAAAAC/loading-bar.gif" alt="Memuat Data..." class="h-20 sm:h-24 mx-auto object-contain">
            </div>
            <div>
                <h3 id="loading-title" class="text-lg font-bold text-slate-800">Memuat Data dari Spreadsheet...</h3>
                <p id="loading-desc" class="text-xs text-slate-500 mt-1">Mengambil rekap nilai dan pengaturan terbaru SDN 1 Parigi</p>
            </div>
            <div id="loading-error-action" class="hidden pt-2">
                <button onclick="fetchSpreadsheetData(true)" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold transition shadow flex items-center justify-center gap-2 mx-auto">
                    <i class="fa-solid fa-rotate-right"></i> Muat Ulang Aplikasi
                </button>
            </div>
        </div>
    </div>

    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-5 flex items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2.5 rounded-2xl">
                    <i class="fa-solid fa-graduation-cap text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold leading-tight">Rekap Nilai Per Kelas</h1>
                    <p class="text-indigo-200 text-xs sm:text-sm">Kelola siswa, mata pelajaran, dan rata-rata nilai per kelas</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <div id="nav-back-container"></div>
                <!-- Print Button Top-Right -->
                <button onclick="openPrintOptionsModal()" title="Cetak / Download Rekap PDF" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3.5 py-2 rounded-xl text-sm font-medium transition shadow flex items-center gap-2 border border-emerald-400/30">
                    <i class="fa-solid fa-print"></i>
                    <span class="hidden sm:inline">Cetak</span>
                </button>
                <!-- Pengaturan Button Top-Right -->
                <button onclick="openSettingsModal()" class="bg-indigo-500 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl text-sm font-medium transition shadow flex items-center gap-2 border border-indigo-400/30">
                    <i class="fa-solid fa-gear"></i>
                    <span class="hidden sm:inline">Pengaturan</span>
                </button>
            </div>
        </div>
        <!-- Academic Info Sub-header Banner -->
        <div class="bg-indigo-700/60 border-t border-indigo-500/40 text-indigo-100 text-xs py-2 px-4 text-center">
            <span id="header-academic-info" class="font-medium tracking-wide">
                <i class="fa-solid fa-calendar-days mr-1.5 opacity-80"></i><span id="academic-term-display">Tahun Ajaran 2026/2027 - Triwulan I</span>
            </span>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">
        <div id="app-container">
            <!-- Dynamic Content rendered via JS -->
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-3 text-center text-sm text-slate-500 overflow-hidden">
        <div class="text-xs text-indigo-600 font-medium bg-slate-50 py-1 border-y border-slate-100">
            <marquee behavior="scroll" direction="left" scrollamount="5" class="max-w-full inline-block">
                <span id="marquee-academic-text">©2026 Rekap Nilai PerTriWulan SDN 1 Parigi Triwulan I Tahun Ajaran 2026/2027</span>
            </marquee>
        </div>
    </footer>

    <!-- Custom Modal Popup -->
    <div id="custom-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div id="modal-content" class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl transform transition-all max-h-[90vh] overflow-y-auto">
            <!-- Modal body dynamically loaded -->
        </div>
    </div>

    <!-- Hidden Printable Container for PDF Export -->
    <div class="hidden">
        <div id="pdf-print-area" class="p-8 bg-white text-slate-900 font-sans" style="width: 1100px; min-height: 750px; font-family: Arial, sans-serif;">
            <!-- Rendered dynamically during PDF print -->
        </div>
    </div>

    <script>
        const defaultData = {
            "Kelas 2": { isSubCategory: false, students: [] },
            "Kelas 4": { isSubCategory: false, students: [] },
            "Kelas 5": { isSubCategory: false, students: [] },
            "Kelas 6": { isSubCategory: false, students: [] },
            "Kelas PAI": {
                isSubCategory: true,
                subjectName: "PAI",
                subClasses: {
                    "Kelas PAI Kelas 1": [],
                    "Kelas PAI Kelas 2": [],
                    "Kelas PAI Kelas 3": [],
                    "Kelas PAI Kelas 4": [],
                    "Kelas PAI Kelas 5": [],
                    "Kelas PAI Kelas 6": []
                }
            }
        };

        const defaultSubjects = ["Matematika", "IPA", "Bahasa Indonesia", "Bahasa Inggris", "PKn", "PJOK", "Seni Budaya"];

        const defaultAdminSettings = {
            academicYear: "2026/2027",
            triwulan: "Triwulan I",
            headmasterName: "",
            headmasterNip: "",
            teachers: {},
            spreadsheetUrl: "https://docs.google.com/spreadsheets/d/1dHd8-ixTrO8kjj_ThpKcE5BZX5c5SnVRS2m6PSzpwMg/edit?usp=drivesdk",
            scriptUrl: "https://script.google.com/macros/s/AKfycbxHj2Yo6cHP3WMZu2wQCckL1Q-TH9EyyO2ZIVnAZn19qUZJKNTo3n0B2SkxprWlKEV9/exec"
        };

        let schoolData = loadAndMigrateData();
        let customSubjectsList = JSON.parse(localStorage.getItem('school_grade_subjects_v4')) || defaultSubjects;
        let adminSettings = JSON.parse(localStorage.getItem('school_grade_admin_v4')) || defaultAdminSettings;

        if (!adminSettings.teachers) adminSettings.teachers = {};

        let currentView = 'classes'; 
        let selectedClass = null;
        let selectedSubClass = null;
        let selectedRecapTw = null;

        function loadAndMigrateData() {
            const raw = localStorage.getItem('school_grade_recap_v4');
            if (!raw) return defaultData;
            try {
                const parsed = JSON.parse(raw);
                Object.keys(parsed).forEach(k => {
                    if (Array.isArray(parsed[k])) {
                        parsed[k] = { isSubCategory: false, students: parsed[k] };
                    }
                });
                return parsed;
            } catch(e) {
                return defaultData;
            }
        }

        function saveLocalOnly() {
            localStorage.setItem('school_grade_recap_v4', JSON.stringify(schoolData));
            localStorage.setItem('school_grade_subjects_v4', JSON.stringify(customSubjectsList));
            localStorage.setItem('school_grade_admin_v4', JSON.stringify(adminSettings));
        }

        function updateAcademicHeaderDisplay() {
            const el = document.getElementById('academic-term-display');
            if (el) {
                el.textContent = `Tahun Ajaran ${adminSettings.academicYear || '2026/2027'} - ${adminSettings.triwulan || 'Triwulan I'}`;
            }
            const marqueeEl = document.getElementById('marquee-academic-text');
            if (marqueeEl) {
                marqueeEl.textContent = `©2026 Rekap Nilai PerTriWulan SDN 1 Parigi ${adminSettings.triwulan || 'Triwulan I'} Tahun Ajaran ${adminSettings.academicYear || '2026/2027'}`;
            }
        }

        function openPrintOptionsModal() {
            let classOptionsHtml = '';
            Object.keys(schoolData).forEach(cls => {
                const clsObj = schoolData[cls];
                if (clsObj.isSubCategory) {
                    classOptionsHtml += `<option value="${cls}||ALL_SUBCLASSES">${cls} (Semua Kelas I - VI)</option>`;
                } else {
                    classOptionsHtml += `<option value="${cls}||">${cls}</option>`;
                }
            });

            showModal(`
                <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-print text-emerald-600 text-lg"></i>
                        <h3 class="text-lg font-bold text-slate-800">Cetak Rekap Nilai PDF</h3>
                    </div>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <form onsubmit="handleGeneratePDFSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Pilih Kelas / Mapel</label>
                        <select id="print-class-select" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 text-sm bg-white">
                            ${classOptionsHtml}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Triwulan (TW)</label>
                        <select id="print-triwulan" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 text-sm bg-white">
                            <option value="Triwulan I" ${adminSettings.triwulan === 'Triwulan I' ? 'selected' : ''}>Triwulan I</option>
                            <option value="Triwulan II" ${adminSettings.triwulan === 'Triwulan II' ? 'selected' : ''}>Triwulan II</option>
                            <option value="Triwulan III" ${adminSettings.triwulan === 'Triwulan III' ? 'selected' : ''}>Triwulan III</option>
                            <option value="Triwulan IV" ${adminSettings.triwulan === 'Triwulan IV' ? 'selected' : ''}>Triwulan IV</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tahun Ajaran</label>
                        <input type="text" id="print-academic-year" required value="${adminSettings.academicYear || '2026/2027'}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm">
                    </div>
                    <div class="flex justify-end space-x-2 pt-3 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-sm">Batal</button>
                        <button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-sm flex items-center gap-2">
                            <i class="fa-solid fa-file-pdf"></i> Download PDF
                        </button>
                    </div>
                </form>
            `);
        }

        function handleGeneratePDFSubmit(event) {
            event.preventDefault();
            const target = document.getElementById('print-class-select').value;
            const tw = document.getElementById('print-triwulan').value;
            const year = document.getElementById('print-academic-year').value.trim();
            if (!target || !year) return;

            const [clsName, subClsName] = target.split('||');
            const parentObj = schoolData[clsName];
            const isSubCat = parentObj && parentObj.isSubCategory;
            const todayDate = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            const printArea = document.getElementById('pdf-print-area');

            const headmasterName = adminSettings.headmasterName || "-";
            const headmasterNip = adminSettings.headmasterNip ? `NIP. ${adminSettings.headmasterNip}` : "";
            const teacherObj = (adminSettings.teachers && adminSettings.teachers[clsName]) || { name: "-", nip: "" };
            const teacherName = teacherObj.name || "-";
            const teacherNip = teacherObj.nip ? `NIP. ${teacherObj.nip}` : "";

            let teacherRoleTitle = isSubCat ? `Guru Mapel ${parentObj.subjectName || "PAI"}` : `Guru ${clsName}`;

            if (isSubCat) {
                const subjectTitle = parentObj.subjectName || "PAI";
                const subClassKeys = Object.keys(parentObj.subClasses || {});

                const buildClassTableHtml = (subKey, classLabel) => {
                    const stds = getStudentList(clsName, subKey);
                    let rowsHtml = '';
                    if (stds.length === 0) {
                        rowsHtml = `<tr><td colspan="3" style="border: 1px solid #000; padding: 4px; text-align: center; color: #777; font-style: italic; font-size: 10px;">- Belum Ada Siswa -</td></tr>`;
                    } else {
                        stds.forEach((s, idx) => {
                            const gradesArr = gradesForTw(s, tw)[subjectTitle] || [];
                            const avg = getAverage(gradesArr);
                            const hasGrades = gradesArr.length > 0;
                            rowsHtml += `
                                <tr>
                                    <td style="border: 1px solid #000; padding: 3px 4px; text-align: center; width: 25px; font-size: 10px;">${idx + 1}</td>
                                    <td style="border: 1px solid #000; padding: 3px 6px; font-size: 10px; font-weight: 500;">${s.name}</td>
                                    <td style="border: 1px solid #000; padding: 3px 4px; text-align: center; font-weight: bold; width: 65px; font-size: 10px;">${hasGrades ? avg : ''}</td>
                                </tr>
                            `;
                        });
                    }
                    return `
                        <div style="flex: 1; min-width: 0;">
                            <table style="width: 100%; border-collapse: collapse; font-family: Arial, sans-serif;">
                                <thead>
                                    <tr style="background-color: #f1f5f9;">
                                        <th style="border: 1px solid #000; padding: 4px; text-align: center; font-size: 10px; font-weight: bold; width: 25px;">NO</th>
                                        <th style="border: 1px solid #000; padding: 4px; text-align: center; font-size: 10px; font-weight: bold;">NAMA</th>
                                        <th style="border: 1px solid #000; padding: 4px; text-align: center; font-size: 10px; font-weight: bold; width: 65px;">${classLabel}</th>
                                    </tr>
                                </thead>
                                <tbody>${rowsHtml}</tbody>
                            </table>
                        </div>
                    `;
                };

                const classRomanLabels = ["KELAS I", "KELAS II", "KELAS III", "KELAS IV", "KELAS V", "KELAS VI"];
                let row1TablesHtml = '', row2TablesHtml = '';
                for (let i = 0; i < 3; i++) row1TablesHtml += buildClassTableHtml(subClassKeys[i] || `Kelas PAI Kelas ${i+1}`, classRomanLabels[i]);
                for (let i = 3; i < 6; i++) row2TablesHtml += buildClassTableHtml(subClassKeys[i] || `Kelas PAI Kelas ${i+1}`, classRomanLabels[i]);

                printArea.innerHTML = `
                    <div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 14px;">
                        <h2 style="font-size: 16px; font-weight: bold; margin: 0; text-transform: uppercase;">SD NEGERI 1 PARIGI</h2>
                        <h1 style="font-size: 14px; font-weight: bold; margin: 3px 0 0 0; text-transform: uppercase;">REKAPITULASI NILAI MATA PELAJARAN ${subjectTitle.toUpperCase()} (KELAS I - VI)</h1>
                        <p style="font-size: 11px; margin: 3px 0 0 0; font-weight: 500;"><strong>${tw}</strong> Tahun Ajaran <strong>${year}</strong></p>
                    </div>
                    <div style="display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-start;">${row1TablesHtml}</div>
                    <div style="display: flex; gap: 12px; margin-bottom: 20px; align-items: flex-start;">${row2TablesHtml}</div>
                    <div style="display: flex; justify-content: space-between; font-size: 11px; margin-top: 25px; page-break-inside: avoid;">
                        <div style="text-align: center; width: 35%;">
                            <p style="margin-bottom: 45px;">Mengetahui,<br>Kepala Sekolah</p>
                            <p style="font-weight: bold; text-decoration: underline; margin: 0;">${headmasterName}</p>
                            <p style="margin: 2px 0 0 0;">${headmasterNip}</p>
                        </div>
                        <div style="text-align: center; width: 35%;">
                            <p style="margin-bottom: 45px;">Daha Selatan, ${todayDate}<br>${teacherRoleTitle}</p>
                            <p style="font-weight: bold; text-decoration: underline; margin: 0;">${teacherName}</p>
                            <p style="margin: 2px 0 0 0;">${teacherNip}</p>
                        </div>
                    </div>
                `;

                closeModal();
                html2pdf().set({ margin: [0.3, 0.3, 0.3, 0.3], filename: `Rekap_${clsName}_${tw}.pdf`, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: [215, 330], orientation: 'landscape' } }).from(printArea).save();
                return;
            }

            let students = (parentObj && parentObj.students) ? parentObj.students : [];
            let allSubjects = new Set();
            students.forEach(s => Object.keys(gradesForTw(s, tw) || {}).forEach(sub => allSubjects.add(sub)));
            const subjectsList = Array.from(allSubjects);

            let tableHeadersHtml = `<th style="border: 1px solid #333; padding: 6px; background-color: #f1f5f9; text-align: center; width: 40px;">No</th><th style="border: 1px solid #333; padding: 6px; background-color: #f1f5f9; text-align: left;">Nama Siswa</th><th style="border: 1px solid #333; padding: 6px; background-color: #f1f5f9; text-align: center; width: 80px;">Kelas</th>`;
            subjectsList.forEach(sub => tableHeadersHtml += `<th style="border: 1px solid #333; padding: 6px; background-color: #f1f5f9; text-align: center;">${sub}</th>`);

            let tableRowsHtml = '';
            students.forEach((s, idx) => {
                const sGrades = gradesForTw(s, tw);
                tableRowsHtml += `<tr><td style="border: 1px solid #333; padding: 6px; text-align: center;">${idx + 1}</td><td style="border: 1px solid #333; padding: 6px; font-weight: bold;">${s.name}</td><td style="border: 1px solid #333; padding: 6px; text-align: center;">${clsName}</td>`;
                subjectsList.forEach(sub => {
                    const arr = sGrades[sub] || [];
                    tableRowsHtml += `<td style="border: 1px solid #333; padding: 6px; text-align: center; font-weight: bold;">${arr.length ? getAverage(arr) : '-'}</td>`;
                });
                tableRowsHtml += `</tr>`;
            });

            printArea.innerHTML = `
                <div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 16px;">
                    <h2 style="font-size: 18px; font-weight: bold; margin: 0; text-transform: uppercase;">SD NEGERI 1 PARIGI</h2>
                    <h1 style="font-size: 16px; font-weight: bold; margin: 4px 0 0 0; text-transform: uppercase;">REKAPITULASI NILAI RATA-RATA SISWA</h1>
                    <p style="font-size: 12px; margin: 4px 0 0 0;">Kelas: <strong>${clsName}</strong> | <strong>${tw}</strong> Tahun Ajaran <strong>${year}</strong></p>
                </div>
                <table style="width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 24px;">
                    <thead><tr>${tableHeadersHtml}</tr></thead>
                    <tbody>${tableRowsHtml}</tbody>
                </table>
            `;

            closeModal();
            html2pdf().set({ margin: [0.4, 0.4, 0.4, 0.4], filename: `Rekap_${clsName}_${tw}.pdf`, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: [215, 330], orientation: 'landscape' } }).from(printArea).save();
        }

        function getAverage(arr) {
            if (!arr || arr.length === 0) return 0;
            return (arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(1);
        }

        function render() {
            updateAcademicHeaderDisplay();
            const container = document.getElementById('app-container');
            const navContainer = document.getElementById('nav-back-container');

            if (currentView === 'classes') {
                navContainer.innerHTML = '';
                container.innerHTML = renderClassesView();
            } else if (currentView === 'pai_subclasses') {
                navContainer.innerHTML = `<button onclick="switchView('classes')" class="bg-indigo-700 text-white px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition shadow flex items-center gap-1.5"><i class="fa-solid fa-arrow-left"></i> Kembali</button>`;
                container.innerHTML = renderSubClassesView(selectedClass);
            } else if (currentView === 'detail') {
                const isSubCat = schoolData[selectedClass] && schoolData[selectedClass].isSubCategory;
                navContainer.innerHTML = `<button onclick="switchView('${isSubCat ? 'pai_subclasses' : 'classes'}'${isSubCat ? ", '" + selectedClass + "'" : ''})" class="bg-indigo-700 text-white px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition shadow flex items-center gap-1.5"><i class="fa-solid fa-arrow-left"></i> Kembali</button>`;
                container.innerHTML = renderClassDetailView(selectedClass, selectedSubClass);
            }
        }

        function switchView(view, className = null, subClassName = null) {
            currentView = view;
            selectedClass = className;
            selectedSubClass = subClassName;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderClassesView() {
            const classesList = Object.keys(schoolData);
            const regularClasses = classesList.filter(cls => !schoolData[cls]?.isSubCategory);
            const subjectClasses = classesList.filter(cls => schoolData[cls]?.isSubCategory);

            let html = `<div class="space-y-6"><div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><h2 class="text-xl font-bold text-slate-800">Daftar Kelas</h2><p class="text-slate-500 text-sm mt-1">Pilih salah satu kelas di bawah untuk melihat rincian siswa dan nilai.</p></div><div><h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 px-1"><i class="fa-solid fa-school mr-1.5 text-indigo-500"></i> Kelas Utama</h3><div class="grid grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4">`;

            regularClasses.forEach(cls => {
                const students = (schoolData[cls] && schoolData[cls].students) ? schoolData[cls].students : [];
                html += `<div onclick="switchView('detail', '${cls}')" class="bg-white p-3.5 sm:p-5 rounded-2xl shadow-sm border border-slate-200/80 hover:border-indigo-500 hover:shadow-md transition cursor-pointer flex items-center justify-between group"><div class="flex items-center space-x-3"><div class="w-10 h-10 bg-indigo-50 group-hover:bg-indigo-600 text-indigo-600 group-hover:text-white rounded-xl flex items-center justify-center font-bold"><i class="fa-solid fa-school"></i></div><div><h3 class="text-sm sm:text-base font-bold text-slate-800">${cls}</h3><p class="text-slate-500 text-xs">${students.length} Siswa</p></div></div><i class="fa-solid fa-chevron-right text-xs text-slate-400"></i></div>`;
            });

            html += `</div></div>`;

            if (subjectClasses.length > 0) {
                html += `<div class="pt-2"><h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 px-1"><i class="fa-solid fa-book-quran mr-1.5 text-emerald-500"></i> Kelompok Kelas Mata Pelajaran</h3><div class="grid grid-cols-1 gap-3">`;
                subjectClasses.forEach(cls => {
                    const subCount = Object.keys(schoolData[cls].subClasses || {}).length;
                    html += `<div onclick="switchView('pai_subclasses', '${cls}')" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 hover:border-emerald-500 hover:shadow-md transition cursor-pointer flex items-center justify-between group"><div class="flex items-center space-x-3.5"><div class="w-12 h-12 bg-emerald-50 group-hover:bg-emerald-600 text-emerald-600 group-hover:text-white rounded-2xl flex items-center justify-center font-bold"><i class="fa-solid fa-book-quran"></i></div><div><h3 class="text-base font-bold text-slate-800">${cls}</h3><p class="text-slate-500 text-xs">Mencakup ${subCount} Tingkat Kelas</p></div></div><i class="fa-solid fa-chevron-right text-xs text-slate-400"></i></div>`;
                });
                html += `</div></div>`;
            }
            return html + `</div>`;
        }

        function renderSubClassesView(parentClsName) {
            const parentObj = schoolData[parentClsName];
            if (!parentObj || !parentObj.subClasses) return '';
            let html = `<div class="space-y-6"><div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><span class="bg-indigo-50 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded-md uppercase">Kelas Berbasis Mapel</span><h2 class="text-2xl font-bold text-slate-800 mt-1">${parentClsName}</h2></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-4">`;
            
            Object.keys(parentObj.subClasses).forEach(subName => {
                const students = getStudentList(parentClsName, subName);
                html += `<div onclick="switchView('detail', '${parentClsName}', '${subName}')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-indigo-500 transition cursor-pointer flex items-center justify-between group"><div class="flex items-center space-x-4"><div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center font-bold"><i class="fa-solid fa-book"></i></div><div><h3 class="text-base font-bold text-slate-800">${subName}</h3><p class="text-slate-500 text-xs">${students.length} Siswa</p></div></div><i class="fa-solid fa-chevron-right text-xs text-slate-400"></i></div>`;
            });
            return html + `</div></div>`;
        }

        const ALL_TRIWULAN = ['Triwulan I', 'Triwulan II', 'Triwulan III', 'Triwulan IV'];
        function getActiveTw() { return adminSettings.triwulan || 'Triwulan I'; }

        function cloneGradeMap(map) {
            const out = {};
            Object.keys(map || {}).forEach(subject => {
                const values = map[subject];
                out[subject] = Array.isArray(values) ? values.slice() : (values == null || values === '' ? [] : [values]);
            });
            return out;
        }

        function gradesForTw(student, tw) {
            if (!student) return {};
            if (student.gradesByTw && student.gradesByTw[tw]) return student.gradesByTw[tw];
            return tw === getActiveTw() ? (student.grades || {}) : {};
        }

        function addGradeForActiveTw(student, subject, value) {
            const tw = getActiveTw();
            if (!student.gradesByTw) student.gradesByTw = {};
            if (!student.gradesByTw[tw]) student.gradesByTw[tw] = {};
            if (!student.gradesByTw[tw][subject]) student.gradesByTw[tw][subject] = [];
            student.gradesByTw[tw][subject].push(value);
            student.grades = cloneGradeMap(student.gradesByTw[tw]);
        }

        function renderTwRecap(students, subjectsList, clsName, subClsName) {
            const tw = selectedRecapTw || getActiveTw();
            const options = ALL_TRIWULAN.map(item => `<option value="${item}" ${item === tw ? 'selected' : ''}>${item}</option>`).join('');
            const rows = students.map((student, idx) => {
                const grades = gradesForTw(student, tw);
                const cells = subjectsList.map(subject => {
                    const vals = grades[subject] || [];
                    return `<td class="px-3 py-2 text-center border-b border-slate-100">${vals.length ? `<span class="font-bold text-indigo-700">${getAverage(vals)}</span>` : '<span class="text-slate-300">-</span>'}</td>`;
                }).join('');
                return `<tr><td class="px-3 py-2 border-b text-slate-500">${idx + 1}</td><td class="px-3 py-2 border-b font-medium">${student.name || ''}</td>${cells}</tr>`;
            }).join('');
            return `<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-5"><div class="p-4 flex items-center justify-between bg-indigo-50/60 border-b"><h3 class="font-bold text-slate-800">Rekap Nilai per TW</h3><label class="text-xs font-semibold">Pilih TW<select onchange="selectedRecapTw=this.value; render()" class="ml-2 border rounded px-2 py-1">${options}</select></label></div><div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead><tr class="bg-slate-50 text-xs text-slate-500 uppercase"><th class="px-3 py-2">No</th><th class="px-3 py-2">Nama</th>${subjectsList.map(sub => `<th class="px-3 py-2 text-center">${sub}</th>`).join('')}</tr></thead><tbody>${rows || `<tr><td colspan="3" class="p-4 text-center text-slate-400">Belum ada siswa</td></tr>`}</tbody></table></div></div>`;
        }

        function renderClassDetailView(clsName, subClsName = null) {
            let students = [];
            let displayTitle = clsName;
            const parentObj = schoolData[clsName];
            const isSubCat = parentObj && parentObj.isSubCategory;
            const fixedSubject = isSubCat ? (parentObj.subjectName || "PAI") : null;

            if (isSubCat && subClsName) {
                students = getStudentList(clsName, subClsName);
                displayTitle = subClsName;
            } else {
                students = (parentObj && parentObj.students) ? parentObj.students : [];
            }

            let allSubjects = new Set();
            if (!isSubCat) {
                customSubjectsList.forEach(sub => allSubjects.add(sub));
                students.forEach(s => Object.keys(gradesForTw(s, getActiveTw()) || {}).forEach(sub => allSubjects.add(sub)));
            } else {
                allSubjects.add(fixedSubject);
            }
            const subjectsList = Array.from(allSubjects);
            if (!selectedRecapTw) selectedRecapTw = getActiveTw();

            let html = `<div class="space-y-6"><div class="bg-white p-6 rounded-2xl shadow-sm border"><h2 class="text-2xl font-bold text-slate-800">${displayTitle}</h2><p class="text-slate-500 text-sm">Daftar siswa dan nilai.</p></div>`;
            html += renderTwRecap(students, subjectsList, clsName, subClsName);

            if (students.length === 0) {
                html += `<div class="bg-white rounded-2xl p-12 text-center border"><h3 class="text-lg font-bold text-slate-700">Belum ada siswa</h3></div>`;
            } else {
                html += `<div class="bg-white rounded-2xl shadow-sm border overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-left"><thead><tr class="bg-slate-50 text-xs font-semibold uppercase border-b"><th class="p-4">Nama Siswa</th>`;
                subjectsList.forEach(sub => html += `<th class="p-4 text-center">${sub}</th>`);
                html += `<th class="p-4 text-center">Aksi</th></tr></thead><tbody class="divide-y text-sm">`;

                students.forEach(student => {
                    const sGrades = gradesForTw(student, getActiveTw());
                    html += `<tr class="hover:bg-slate-50"><td class="p-4 font-semibold">${student.name}</td>`;
                    subjectsList.forEach(sub => {
                        const arr = sGrades[sub] || [];
                        html += `<td class="p-4 text-center">${arr.length ? getAverage(arr) : '-'}</td>`;
                    });
                    html += `<td class="p-4 text-center"><button onclick="openAddGradeModal('${clsName}', '${subClsName || ''}', '${student.id}')" class="p-2 bg-emerald-50 text-emerald-600 rounded-xl"><i class="fa-solid fa-plus-circle"></i></button></td></tr>`;
                });
                html += `</tbody></table></div></div>`;
            }
            return html + `</div>`;
        }

        function showModal(html) {
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('custom-modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('custom-modal').classList.add('hidden'); }

        function getStudentList(clsName, subClsName) {
            const parent = schoolData[clsName];
            if (!parent) return [];
            if (parent.isSubCategory && subClsName) return parent.subClasses[subClsName] || [];
            return parent.students || [];
        }

        function openAddGradeModal(clsName, subClsName, studentId) {
            const students = getStudentList(clsName, subClsName);
            const student = students.find(s => s.id === studentId);
            if (!student) return;
            const parentObj = schoolData[clsName];
            const isSubCat = parentObj && parentObj.isSubCategory;
            const fixedSubject = isSubCat ? (parentObj.subjectName || "PAI") : null;

            let subjectInputHtml = isSubCat ? 
                `<div><label class="block text-xs font-semibold uppercase mb-1">Mata Pelajaran</label><input type="text" id="grade-subject" readonly value="${fixedSubject}" class="w-full px-4 py-2.5 rounded-xl border bg-slate-100 text-sm"></div>` :
                `<div><label class="block text-xs font-semibold uppercase mb-1">Mata Pelajaran</label><select id="grade-subject" class="w-full px-4 py-2.5 rounded-xl border bg-white text-sm">${customSubjectsList.map(s => `<option value="${s}">${s}</option>`).join('')}</select></div>`;

            showModal(`
                <h3 class="text-lg font-bold mb-1">Tambah Nilai</h3><p class="text-sm text-slate-500 mb-4">${student.name}</p>
                <form onsubmit="handleAddGradeSubmit(event, '${clsName}', '${subClsName}', '${studentId}')" class="space-y-4">
                    ${subjectInputHtml}
                    <div><label class="block text-xs font-semibold uppercase mb-1">Nilai (0-100)</label><input type="number" id="grade-value" min="0" max="100" required class="w-full px-4 py-2.5 rounded-xl border text-sm"></div>
                    <div class="flex justify-end gap-2"><button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-sm">Batal</button><button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm">Simpan</button></div>
                </form>
            `);
        }

        function handleAddGradeSubmit(event, clsName, subClsName, studentId) {
            event.preventDefault();
            const subject = document.getElementById('grade-subject').value.trim();
            const val = parseFloat(document.getElementById('grade-value').value);
            if (!subject || isNaN(val)) return;

            const student = getStudentList(clsName, subClsName).find(s => s.id === studentId);
            if (student) {
                addGradeForActiveTw(student, subject, val);
                saveData();
                closeModal();
                render();
            }
        }

        function openSettingsModal() {
            showModal(`
                <div class="flex justify-between pb-3 border-b mb-4"><h3 class="text-lg font-bold">Pengaturan</h3><button onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
                <div class="space-y-2">
                    <button onclick="triggerManualSpreadsheetReload()" class="w-full p-3 bg-emerald-50 text-emerald-700 rounded-xl font-semibold text-sm text-left"><i class="fa-solid fa-rotate-right mr-2"></i> Muat Ulang dari Spreadsheet</button>
                </div>
            `);
        }

        const SCRIPT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwLcMTyJq76nJUDGJTazW3H05Ywjbef7N1JZZUz23LTOQoHHt4yFadmrUBfCs9Tf8CD/exec';

        async function fetchSpreadsheetData(showLoader = true) {
            const loader = document.getElementById('loading-overlay');
            if (loader && showLoader) loader.classList.remove('hidden');
            const callbackName = 'sheetCallback_' + Date.now();
            const script = document.createElement('script');
            let finished = false;
            const cleanup = () => {
                if (finished) return;
                finished = true;
                try { delete window[callbackName]; } catch(e){}
                if (script.parentNode) script.parentNode.removeChild(script);
                if (loader) loader.classList.add('hidden');
            };
            window[callbackName] = function(payload) {
                try {
                    if (payload && payload.ok === false) throw new Error(payload.error);
                    if (payload) {
                        schoolData = payload.schoolData || {};
                        customSubjectsList = payload.subjects || defaultSubjects;
                        adminSettings = Object.assign({}, defaultAdminSettings, adminSettings, payload.settings || {});
                        saveLocalOnly();
                    }
                    render();
                } catch(err) {
                    render();
                } finally { cleanup(); }
            };
            script.onerror = () => { cleanup(); render(); };
            script.src = SCRIPT_WEB_APP_URL + '?action=getAppData&callback=' + callbackName + '&_=' + Date.now();
            document.head.appendChild(script);
        }

        async function saveData(syncToBackend = true) {
            saveLocalOnly();
            if (!syncToBackend) return;
            try {
                await fetch(SCRIPT_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'saveAppData', schoolData: schoolData, subjects: customSubjectsList, settings: adminSettings })
                });
            } catch(err) {}
        }

        function triggerManualSpreadsheetReload() { closeModal(); fetchSpreadsheetData(true); }
        window.onload = () => fetchSpreadsheetData(true);
    </script>
</body>
</html>
