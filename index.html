<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekap Nilai Per Kelas</title>
<!-- Tailwind CSS for modern styling -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Google Fonts Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- FontAwesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- html2pdf for downloading formatted PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
<div id="loading-overlay" class="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center p-4 transition-opacity duration-300">
<div class="text-center space-y-4 max-w-sm">
<div id="loading-spinner-box">
<!-- GIF loading diperbesar 2x lipat -->
<img src="https://media.tenor.com/pgO8hZgOW5AAAAAC/loading-bar.gif" alt="Memuat Data..." class="h-40 sm:h-48 mx-auto object-contain">
</div>
<div>
<h3 id="loading-title" class="text-lg font-bold text-slate-800">Memuat Data dari Spreadsheet...</h3>
<p id="loading-desc" class="text-xs text-slate-500 mt-1">Mengambil rekap nilai dan pengaturan terbaru SDN 1 Parigi</p>
</div>
<div id="loading-error-action" class="hidden pt-2">
<button onclick="fetchSpreadsheetData(true)" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold transition shadow flex items-center justify-center gap-2 mx-auto">
<i class="fa-solid fa-rotate-right"></i> Muat Ulang Aplikasi
</button>
</div>
</div>
</div>
<header class="bg-indigo-600 text-white shadow-md">
<div class="max-w-4xl mx-auto px-4 py-5 flex items-center justify-between gap-4">
<div class="flex items-center space-x-3">
<div class="bg-white/10 p-2.5 rounded-2xl">
<i class="fa-solid fa-graduation-cap text-2xl"></i>
</div>
<div>
<h1 class="text-xl sm:text-2xl font-bold leading-tight">Rekap Nilai Per Kelas</h1>
<p class="text-indigo-200 text-xs sm:text-sm">Kelola siswa, mata pelajaran, dan rata-rata nilai per kelas</p>
</div>
</div>
<div class="flex items-center space-x-2">
<div id="nav-back-container"></div>
<!-- Print Button Top-Right -->
<button onclick="openPrintOptionsModal()" title="Cetak / Download Rekap PDF" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3.5 py-2 rounded-xl text-sm font-medium transition shadow flex items-center gap-2 border border-emerald-400/30">
<i class="fa-solid fa-print"></i>
<span class="hidden sm:inline">Cetak</span>
</button>
<!-- Pengaturan Button Top-Right -->
<button onclick="openSettingsModal()" class="bg-indigo-500 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl text-sm font-medium transition shadow flex items-center gap-2 border border-indigo-400/30">
<i class="fa-solid fa-gear"></i>
<span class="hidden sm:inline">Pengaturan</span>
</button>
</div>
</div>
<!-- Academic Info Sub-header Banner -->
<div class="bg-indigo-700/60 border-t border-indigo-500/40 text-indigo-100 text-xs py-2 px-4 text-center">
<span id="header-academic-info" class="font-medium tracking-wide">
<i class="fa-solid fa-calendar-days mr-1.5 opacity-80"></i><span id="academic-term-display">Tahun Ajaran 2026/2027 - Triwulan I</span>
</span>
</div>
</header>
<main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">
<div id="app-container">
<!-- Dynamic Content rendered via JS -->
</div>
</main>
<footer class="bg-white border-t border-slate-200 py-3 text-center text-sm text-slate-500 overflow-hidden">
<div class="text-xs text-indigo-600 font-medium bg-slate-50 py-1 border-y border-slate-100">
<marquee behavior="scroll" direction="left" scrollamount="5" class="max-w-full inline-block">
<span id="marquee-academic-text">©2026 Rekap Nilai PerTriWulan SDN 1 Parigi Triwulan I Tahun Ajaran 2026/2027</span>
</marquee>
</div>
</footer>
<!-- Custom Modal Popup -->
<div id="custom-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
<div id="modal-content" class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl transform transition-all max-h-[90vh] overflow-y-auto">
<!-- Modal body dynamically loaded -->
</div>
</div>
<!-- Hidden Printable Container for PDF Export -->
<div class="hidden">
<div id="pdf-print-area" class="p-8 bg-white text-slate-900 font-sans" style="width: 1100px; min-height: 750px; font-family: Arial, sans-serif;">
<!-- Rendered dynamically during PDF print -->
</div>
</div>
<script>
const defaultData = {
"Kelas 2": {
isSubCategory: false,
students: []
},
"Kelas 4": {
isSubCategory: false,
students: []
},
"Kelas 5": {
isSubCategory: false,
students: []
},
"Kelas 6": {
isSubCategory: false,
students: []
},
"Kelas PAI": {
isSubCategory: true,
subjectName: "PAI",
subClasses: {
"PAI Kelas 1": [],
"PAI Kelas 2": [],
"PAI Kelas 3": [],
"PAI Kelas 4": [],
"PAI Kelas 5": [],
"PAI Kelas 6": []
}
}
};
const defaultSubjects = ["Matematika", "IPA", "Bahasa Indonesia", "Bahasa Inggris", "PKn", "PJOK", "Seni Budaya"];
const defaultAdminSettings = {
academicYear: "2026/2027",
triwulan: "Triwulan I",
headmasterName: "",
headmasterNip: "",
teachers: {
"Kelas 2": { name: "", nip: "" },
"Kelas 4": { name: "", nip: "" },
"Kelas 5": { name: "", nip: "" },
"Kelas 6": { name: "", nip: "" },
"Kelas PAI": { name: "", nip: "" }
},
spreadsheetUrl: "https://docs.google.com/spreadsheets/d/1dHd8-ixTrO8kjj_ThpKcE5BZX5c5SnVRS2m6PSzpwMg/edit?usp=drivesdk",
scriptUrl: ""
};
let schoolData = loadAndMigrateData();
let customSubjectsList = JSON.parse(localStorage.getItem('school_grade_subjects_v4')) || defaultSubjects;
let adminSettings = JSON.parse(localStorage.getItem('school_grade_admin_v4')) || defaultAdminSettings;
if (!adminSettings.teachers) adminSettings.teachers = {};
if (!adminSettings.spreadsheetUrl) adminSettings.spreadsheetUrl = defaultAdminSettings.spreadsheetUrl;
if (!adminSettings.scriptUrl) adminSettings.scriptUrl = '';
let currentView = 'classes';
let selectedClass = null;
let selectedSubClass = null;
let selectedRecapTw = null;
function loadAndMigrateData() {
const raw = localStorage.getItem('school_grade_recap_v4');
if (!raw) return defaultData;
try {
const parsed = JSON.parse(raw);
Object.keys(parsed).forEach(k => {
if (Array.isArray(parsed[k])) {
parsed[k] = { isSubCategory: false, students: parsed[k] };
}
});
return parsed;
} catch(e) {
return defaultData;
}
}
function saveDataLocal() {
localStorage.setItem('school_grade_recap_v4', JSON.stringify(schoolData));
localStorage.setItem('school_grade_subjects_v4', JSON.stringify(customSubjectsList));
localStorage.setItem('school_grade_admin_v4', JSON.stringify(adminSettings));
}
function updateAcademicHeaderDisplay() {
const el = document.getElementById('academic-term-display');
if (el) {
el.textContent = `Tahun Ajaran ${adminSettings.academicYear || '2026/2027'} - ${adminSettings.triwulan || 'Triwulan I'}`;
}
const marqueeEl = document.getElementById('marquee-academic-text');
if (marqueeEl) {
marqueeEl.textContent = `©2026 Rekap Nilai PerTriWulan SDN 1 Parigi ${adminSettings.triwulan || 'Triwulan I'} Tahun Ajaran ${adminSettings.academicYear || '2026/2027'}`;
}
}
function openPrintOptionsModal() {
let classOptionsHtml = '';
Object.keys(schoolData).forEach(cls => {
const clsObj = schoolData[cls];
if (clsObj.isSubCategory) {
classOptionsHtml += `<option value="${cls}||ALL_SUBCLASSES">${cls} (Semua Kelas I - VI)</option>`;
} else {
classOptionsHtml += `<option value="${cls}||">${cls}</option>`;
}
});
showModal(`
<div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
<div class="flex items-center space-x-2">
<i class="fa-solid fa-print text-emerald-600 text-lg"></i>
<h3 class="text-lg font-bold text-slate-800">Cetak Rekap Nilai PDF</h3>
</div>
<button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1">
<i class="fa-solid fa-xmark text-lg"></i>
</button>
</div>
<form onsubmit="handleGeneratePDFSubmit(event)" class="space-y-4">
<div>
<label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Pilih Kelas / Mapel</label>
<select id="print-class-select" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 text-sm bg-white">
${classOptionsHtml}
</select>
</div>
<div>
<label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Triwulan (TW)</label>
<select id="print-triwulan" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 text-sm bg-white">
<option value="Triwulan I" ${adminSettings.triwulan === 'Triwulan I' ? 'selected' : ''}>Triwulan I</option>
<option value="Triwulan II" ${adminSettings.triwulan === 'Triwulan II' ? 'selected' : ''}>Triwulan II</option>
<option value="Triwulan III" ${adminSettings.triwulan === 'Triwulan III' ? 'selected' : ''}>Triwulan III</option>
<option value="Triwulan IV" ${adminSettings.triwulan === 'Triwulan IV' ? 'selected' : ''}>Triwulan IV</option>
</select>
</div>
<div>
<label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tahun Ajaran</label>
<input type="text" id="print-academic-year" required value="${adminSettings.academicYear || '2026/2027'}" placeholder="Contoh: 2026/2027" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 text-sm">
</div>
<div class="bg-indigo-50/60 p-3 rounded-xl border border-indigo-100 text-xs text-indigo-700 flex items-center gap-2">
<i class="fa-solid fa-circle-info text-indigo-500 text-sm flex-shrink-0"></i>
<span>Nama/NIP Kepala Sekolah dan Guru disesuaikan otomatis dari Pengaturan Admin.</span>
</div>
<div class="flex justify-end space-x-2 pt-3 border-t border-slate-100">
<button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-medium transition">Batal</button>
<button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-medium transition flex items-center gap-2">
<i class="fa-solid fa-file-pdf"></i> Download PDF
</button>
</div>
</form>
`);
}
function handleGeneratePDFSubmit(event) {
event.preventDefault();
const target = document.getElementById('print-class-select').value;
const tw = document.getElementById('print-triwulan').value;
const year = document.getElementById('print-academic-year').value.trim();
if (!target || !year) return;
const [clsName, subClsName] = target.split('||');
const parentObj = schoolData[clsName];
const isSubCat = parentObj && parentObj.isSubCategory;
const todayDate = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
const printArea = document.getElementById('pdf-print-area');
const headmasterName = adminSettings.headmasterName || "-";
const headmasterNip = adminSettings.headmasterNip ? `NIP. ${adminSettings.headmasterNip}` : "";
const teacherObj = (adminSettings.teachers && adminSettings.teachers[clsName]) || { name: "-", nip: "" };
const teacherName = teacherObj.name || "-";
const teacherNip = teacherObj.nip ? `NIP. ${teacherObj.nip}` : "";
let teacherRoleTitle = "Guru Kelas";
if (isSubCat) {
teacherRoleTitle = `Guru Mapel ${parentObj.subjectName || "PAI"}`;
} else {
teacherRoleTitle = `Guru ${clsName}`;
}
if (isSubCat) {
const subjectTitle = parentObj.subjectName || "PAI";
const subClassKeys = Object.keys(parentObj.subClasses || {});
const buildClassTableHtml = (subKey, classLabel) => {
const stds = getStudentList(clsName, subKey);
let rowsHtml = '';
if (stds.length === 0) {
rowsHtml = `<tr><td colspan="3" style="border: 1px solid #000; padding: 4px; text-align: center; color: #777; font-style: italic; font-size: 10px;">- Belum Ada Siswa -</td></tr>`;
} else {
stds.forEach((s, idx) => {
const gradesArr = gradesForTw(s, tw)[subjectTitle] || [];
const avg = getAverage(gradesArr);
const hasGrades = gradesArr.length > 0;
rowsHtml += `<tr> <td style="border: 1px solid #000; padding: 3px 4px; text-align: center; width: 25px; font-size: 10px;">${idx + 1}</td> <td style="border: 1px solid #000; padding: 3px 6px; font-size: 10px; font-weight: 500;">${s.name}</td> <td style="border: 1px solid #000; padding: 3px 4px; text-align: center; font-weight: bold; width: 65px; font-size: 10px;">${hasGrades ? avg : ''}</td> </tr>`;
});
}
return `<div style="flex: 1; min-width: 0;"> <table style="width: 100%; border-collapse: collapse; font-family: Arial, sans-serif;"> <thead> <tr style="background-color: #f1f5f9;"> <th style="border: 1px solid #000; padding: 4px; text-align: center; font-size: 10px; font-weight: bold; width: 25px;">NO</th> <th style="border: 1px solid #000; padding: 4px; text-align: center; font-size: 10px; font-weight: bold;">NAMA</th> <th style="border: 1px solid #000; padding: 4px; text-align: center; font-size: 10px; font-weight: bold; width: 65px;">${classLabel}</th> </tr> </thead> <tbody> ${rowsHtml} </tbody> </table> </div>`;
};
const classRomanLabels = ["KELAS I", "KELAS II", "KELAS III", "KELAS IV", "KELAS V", "KELAS VI"];
let row1TablesHtml = '';
let row2TablesHtml = '';
for (let i = 0; i < 3; i++) {
const key = subClassKeys[i] || `PAI Kelas ${i+1}`;
row1TablesHtml += buildClassTableHtml(key, classRomanLabels[i]);
}
for (let i = 3; i < 6; i++) {
const key = subClassKeys[i] || `PAI Kelas ${i+1}`;
row2TablesHtml += buildClassTableHtml(key, classRomanLabels[i]);
}
printArea.innerHTML = `
<div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 14px;">
<h2 style="font-size: 16px; font-weight: bold; margin: 0; text-transform: uppercase;">SD NEGERI 1 PARIGI</h2>
<h1 style="font-size: 14px; font-weight: bold; margin: 3px 0 0 0; text-transform: uppercase;">REKAPITULASI NILAI MATA PELAJARAN {subjectTitle.toUpperCase()} (KELAS I - VI)</h1>
<p style="font-size: 11px; margin: 3px 0 0 0; font-weight: 500;"><strong>${tw}</strong> Tahun Ajaran <strong>${year}</strong></p>
</div>
<div style="display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-start;">
${row1TablesHtml}
</div>
<div style="display: flex; gap: 12px; margin-bottom: 20px; align-items: flex-start;">
${row2TablesHtml}
</div>
<div style="display: flex; justify-content: space-between; font-size: 11px; margin-top: 25px; page-break-inside: avoid;">
<div style="text-align: center; width: 35%;">
<p style="margin-bottom: 45px;">Mengetahui,
Kepala Sekolah</p>
<p style="font-weight: bold; text-decoration: underline; margin: 0;">{headmasterName}</p>
<p style="margin: 2px 0 0 0;">{headmasterNip}</p>
</div>
<div style="text-align: center; width: 35%;">
<p style="margin-bottom: 45px;">Daha Selatan, ${todayDate}<br>${teacherRoleTitle}</p>
<p style="font-weight: bold; text-decoration: underline; margin: 0;">${teacherName}</p>
<p style="margin: 2px 0 0 0;">${teacherNip}</p>
</div>
</div>
`;
const opt = {
margin:       [0.3, 0.3, 0.3, 0.3],
filename:     `Rekap_Nilai_${clsName.replace(/\s+/g, '_')}_Semua_Kelas_${tw.replace(/\s+/g, '_')}_${year.replace(/\//g, '-')}.pdf`,
image:        { type: 'jpeg', quality: 0.98 },
html2canvas:  { scale: 2, logging: false },
jsPDF:        { unit: 'mm', format: [215, 330], orientation: 'landscape' }
};
closeModal();
html2pdf().set(opt).from(printArea).save();
return;
}
let students = (parentObj && parentObj.students) ? parentObj.students : [];
let displayTitle = clsName;
let allSubjects = new Set();
students.forEach(s => {
const gMap = gradesForTw(s, tw);
Object.keys(gMap || {}).forEach(sub => allSubjects.add(sub));
});
const subjectsList = Array.from(allSubjects);
let tableHeadersHtml = `<th style="border: 1px solid #333; padding: 6px; background-color: #f1f5f9; text-align: center; width: 40px;">No</th>`;
tableHeadersHtml += `<th style="border: 1px solid #333; padding: 6px; background-color: #f1f5f9; text-align: left;">Nama Siswa</th>`;
tableHeadersHtml += `<th style="border: 1px solid #333; padding: 6px; background-color: #f1f5f9; text-align: center; width: 80px;">Kelas</th>`;
subjectsList.forEach(sub => {
tableHeadersHtml += `<th style="border: 1px solid #333; padding: 6px; background-color: #f1f5f9; text-align: center;">${sub}<br><span style="font-size: 9px; font-weight: normal;">(Rata-rata)</span></th>`;
});
let tableRowsHtml = '';
if (students.length === 0) {
const totalCols = 3 + subjectsList.length;
tableRowsHtml = `<tr><td colspan="${totalCols}" style="border: 1px solid #333; padding: 12px; text-align: center; color: #666;">Tidak ada data siswa.</td></tr>`;
} else {
students.forEach((s, idx) => {
const studentGrades = gradesForTw(s, tw);
tableRowsHtml += `<tr>`;
tableRowsHtml += `<td style="border: 1px solid #333; padding: 6px; text-align: center;">${idx + 1}</td>`;
tableRowsHtml += `<td style="border: 1px solid #333; padding: 6px; font-weight: bold;">${s.name}</td>`;
tableRowsHtml += `<td style="border: 1px solid #333; padding: 6px; text-align: center;">${displayTitle}</td>`;
subjectsList.forEach(sub => {
const gradesArr = studentGrades[sub] || [];
const avg = getAverage(gradesArr);
const hasGrades = gradesArr.length > 0;
tableRowsHtml += `<td style="border: 1px solid #333; padding: 6px; text-align: center; font-weight: bold;">${hasGrades ? avg : '-'}</td>`;
});
tableRowsHtml += `</tr>`;
});
}
printArea.innerHTML = `
<div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 16px;">
<h2 style="font-size: 18px; font-weight: bold; margin: 0; text-transform: uppercase;">SD NEGERI 1 PARIGI</h2>
<h1 style="font-size: 16px; font-weight: bold; margin: 4px 0 0 0; text-transform: uppercase;">REKAPITULASI NILAI RATA-RATA SISWA</h1>
<p style="font-size: 12px; margin: 4px 0 0 0; font-weight: 500;">Kelas: <strong>${displayTitle}</strong> | <strong>${tw}</strong> Tahun Ajaran <strong>${year}</strong></p>
</div>
<table style="width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 24px;">
<thead>
<tr>${tableHeadersHtml}</tr>
</thead>
<tbody>
${tableRowsHtml}
</tbody>
</table>
<div style="display: flex; justify-content: space-between; font-size: 11px; margin-top: 35px; page-break-inside: avoid;">
<div style="text-align: center; width: 35%;">
<p style="margin-bottom: 50px;">Mengetahui,
Kepala Sekolah</p>
<p style="font-weight: bold; text-decoration: underline; margin: 0;">{headmasterName}</p>
<p style="margin: 2px 0 0 0;">{headmasterNip}</p>
</div>
<div style="text-align: center; width: 35%;">
<p style="margin-bottom: 50px;">Daha Selatan, ${todayDate}<br>${teacherRoleTitle}</p>
<p style="font-weight: bold; text-decoration: underline; margin: 0;">${teacherName}</p>
<p style="margin: 2px 0 0 0;">${teacherNip}</p>
</div>
</div>
`;
const opt = {
margin:       [0.4, 0.4, 0.4, 0.4],
filename:     `Rekap_Nilai_${displayTitle.replace(/\s+/g, '_')}_${tw.replace(/\s+/g, '_')}_${year.replace(/\//g, '-')}.pdf`,
image:        { type: 'jpeg', quality: 0.98 },
html2canvas:  { scale: 2, logging: false },
jsPDF:        { unit: 'mm', format: [215, 330], orientation: 'landscape' }
};
closeModal();
html2pdf().set(opt).from(printArea).save();
}
function getAverage(arr) {
if (!arr || arr.length === 0) return 0;
const sum = arr.reduce((a, b) => a + b, 0);
return (sum / arr.length).toFixed(1);
}
function render() {
updateAcademicHeaderDisplay();
const container = document.getElementById('app-container');
const navContainer = document.getElementById('nav-back-container');
if (currentView === 'classes') {
navContainer.innerHTML = '';
container.innerHTML = renderClassesView();
} else if (currentView === 'pai_subclasses') {
navContainer.innerHTML = `<button onclick="switchView('classes')" class="bg-indigo-700 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition shadow flex items-center gap-1.5"> <i class="fa-solid fa-arrow-left"></i> Kembali </button>`;
container.innerHTML = renderSubClassesView(selectedClass);
} else if (currentView === 'detail') {
const isSubCat = schoolData[selectedClass] && schoolData[selectedClass].isSubCategory;
const backTarget = isSubCat ? 'pai_subclasses' : 'classes';
const backParent = isSubCat ? String(selectedClass || '').replace(/'/g, "\'") : '';
navContainer.innerHTML = `<button onclick="switchView('${backTarget}'${isSubCat ? ", '" + backParent + "'" : ''})" class="bg-indigo-700 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition shadow flex items-center gap-1.5"> <i class="fa-solid fa-arrow-left"></i> Kembali </button>`;
container.innerHTML = renderClassDetailView(selectedClass, selectedSubClass);
}
}
function switchView(view, className = null, subClassName = null) {
currentView = view;
selectedClass = className;
selectedSubClass = subClassName;
render();
window.scrollTo({ top: 0, behavior: 'smooth' });
}
function renderClassesView() {
const classesList = Object.keys(schoolData);
const regularClasses = classesList.filter(cls => !schoolData[cls]?.isSubCategory);
const subjectClasses = classesList.filter(cls => schoolData[cls]?.isSubCategory);
let html = `
<div class="space-y-6">
<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
<h2 class="text-xl font-bold text-slate-800">Daftar Kelas</h2>
<p class="text-slate-500 text-sm mt-1">Pilih salah satu kelas di bawah untuk melihat rincian siswa dan nilai.</p>
</div>
<div>
<h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 px-1">

showModal(`<h3 class="text-lg font-bold text-slate-800 mb-1">Edit Nilai</h3> <p class="text-slate-500 text-sm mb-4">Mapel: <span class="font-semibold text-slate-700">${subject}</span> (Nilai #${index + 1})</p> <form onsubmit="handleUpdateIndividualGrade(event, '${clsName}', '${subClsName}', '${studentId}', '${subject}', ${index})" class="space-y-4"> <div> <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nilai Baru (0 - 100)</label> <input type="number" id="edit-grade-value" min="0" max="100" required value="${currentScore}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 text-sm"> </div> <div class="flex justify-end space-x-2 pt-2"> <button type="button" onclick="openDetailStudentModal('${clsName}', '${subClsName}', '${studentId}')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-medium transition">Kembali</button> <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium transition">Simpan Perubahan</button> </div> </form>`);

function handleUpdateIndividualGrade(event, clsName, subClsName, studentId, subject, index) {
event.preventDefault();
const val = parseFloat(document.getElementById('edit-grade-value').value);
if (isNaN(val)) return;
const students = getStudentList(clsName, subClsName);
const student = students.find(s => s.id === studentId);
if (student) {
ensureStudentTwData(student);
const tw = getActiveTw();
if (student.grades[subject]) student.grades[subject][index] = val;
if (student.gradesByTw[tw] && student.gradesByTw[tw][subject]) student.gradesByTw[tw][subject][index] = val;
saveData();
openDetailStudentModal(clsName, subClsName, studentId);
render();
}
}

function handleSaveAdminSettings(event) {
event.preventDefault();
const year = document.getElementById('admin-academic-year').value.trim();
const tw = document.getElementById('admin-triwulan').value;
const hmName = document.getElementById('admin-headmaster-name').value.trim();
const hmNip = document.getElementById('admin-headmaster-nip').value.trim();
if (!year) return;
const oldTw = getActiveTw();
if (oldTw !== tw) switchStudentsToTw(tw, oldTw);
adminSettings.academicYear = year;
adminSettings.triwulan = tw;
selectedRecapTw = tw;
adminSettings.headmasterName = hmName;
adminSettings.headmasterNip = hmNip;
const teacherInputs = document.querySelectorAll('.teacher-input');
if (!adminSettings.teachers) adminSettings.teachers = {};
teacherInputs.forEach(input => {
const key = decodeURIComponent(input.getAttribute('data-teacher-key'));
const field = input.getAttribute('data-field');
if (!adminSettings.teachers[key]) {
adminSettings.teachers[key] = { name: '', nip: '' };
}
adminSettings.teachers[key][field] = input.value.trim();
});
saveData();
openSettingsModal();
render();
}

function deleteSubject(index) {
const name = customSubjectsList[index];
if (!confirm(`Hapus mapel "${name}" dari daftar? Nilai lama dengan nama mapel ini juga akan dihapus dari semua siswa.`)) return;
customSubjectsList.splice(index, 1);
Object.keys(schoolData).forEach(cls => {
const obj = schoolData[cls];
const lists = obj.isSubCategory ? Object.values(obj.subClasses || {}) : [obj.students || []];
lists.forEach(list => list.forEach(st => {
if (st.grades) delete st.grades[name];
Object.values(st.gradesByTw || {}).forEach(map => { if (map) delete map[name]; });
}));
});
saveData(); openManageSubjectsModal(); render();
}
function deleteGrade(clsName, subClsName, studentId, subject, index) {
if (!confirm('Hapus nilai ini?')) return;
const student = getStudentList(clsName, subClsName).find(x => x.id === studentId);
if (student) {
ensureStudentTwData(student);
const tw = getActiveTw();
if (student.grades && student.grades[subject]) {
student.grades[subject].splice(index, 1);
if (!student.grades[subject].length) delete student.grades[subject];
}
const twMap = student.gradesByTw[tw] || {};
if (twMap[subject]) {
twMap[subject].splice(index, 1);
if (!twMap[subject].length) delete twMap[subject];
}
}
saveData(); openDetailStudentModal(clsName, subClsName, studentId); render();
}
function openManageSubjectsModal() {
let subjectsListHtml = customSubjectsList.map((sub, idx) => `<div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-sm"> <span class="font-medium text-slate-800">${sub}</span> <div class="flex gap-1"><button onclick="openEditSubjectNameModal(${idx})" class="px-2.5 py-1 bg-amber-50 text-amber-600 rounded-lg text-xs font-semibold"><i class="fa-solid fa-pen"></i> Edit</button><button onclick="deleteSubject(${idx})" class="px-2.5 py-1 bg-rose-50 text-rose-600 rounded-lg text-xs font-semibold">Hapus</button></div> </div>`).join('');
showModal(`

event.preventDefault();

function openEditSubjectNameModal(index) {
const currentSub = customSubjectsList[index];
showModal(`<h3 class="text-lg font-bold text-slate-800 mb-1">Edit Mata Pelajaran</h3> <p class="text-slate-500 text-sm mb-4">Ubah nama mapel: <span class="font-semibold text-slate-700">${currentSub}</span></p> <form onsubmit="handleUpdateSubjectNameSubmit(event, ${index})" class="space-y-4"> <div> <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Mapel Baru</label> <input type="text" id="edit-subject-input" required value="${currentSub}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 text-sm"> </div> <div class="flex justify-end space-x-2 pt-2"> <button type="button" onclick="openManageSubjectsModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-medium transition">Batal</button> <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium transition">Simpan Perubahan</button> </div> </form>`);
}
function handleUpdateSubjectNameSubmit(event, index) {

const newVal = document.getElementById('edit-subject-input').value.trim();
if (!newVal) return;
customSubjectsList[index] = newVal;
saveData();

}
const SCRIPT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzXD6Bzb2JRHGREzTqI28Xnx2QDECcD5_upjQpZS1adge14II5qHaWX97PPPOwYMoCS/exec';
async function fetchSpreadsheetData(showLoader = true) {
const loader = document.getElementById('loading-overlay');
if (loader && showLoader) loader.classList.remove('hidden');
const endpoint = SCRIPT_WEB_APP_URL;
if (!endpoint || endpoint === 'TEMPEL_URL_WEB_APP_DI_SINI') {
if (loader) loader.classList.add('hidden');
render();
alert('Tempel URL Web App hasil Deploy Code.gs pada konstanta SCRIPT_WEB_APP_URL di index.html.');
return;
}
adminSettings.scriptUrl = endpoint;
const callbackName = 'sheetCallback_' + Date.now();
const script = document.createElement('script');
let finished = false;
const cleanup = () => {
if (finished) return;
finished = true;
try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
if (script.parentNode) script.parentNode.removeChild(script);
if (loader) loader.classList.add('hidden');
};
window[callbackName] = function(payload) {
try {
if (payload && payload.ok === false) throw new Error(payload.error || 'Gagal membaca Spreadsheet');
if (payload) {
schoolData = payload.schoolData || {};
customSubjectsList = payload.subjects || defaultSubjects;
adminSettings = Object.assign({}, defaultAdminSettings, adminSettings, payload.settings || {});
if (!adminSettings.teachers) adminSettings.teachers = {};
adminSettings.scriptUrl = endpoint;
saveLocalOnly();
}
render();
} catch (err) {
console.error(err);
render();
alert('Data Spreadsheet tidak dapat dibaca: ' + (err.message || err));
} finally { cleanup(); }
};
script.onerror = function() {
cleanup(); render();
alert('Gagal terhubung ke Web App. Periksa URL Deploy dan aksesnya (Anyone).');
};
script.src = endpoint + (endpoint.includes('?') ? '&' : '?') + 'action=getAppData&callback=' + callbackName + '&_=' + Date.now();
document.head.appendChild(script);
}
function saveLocalOnly() {
localStorage.setItem('school_grade_recap_v4', JSON.stringify(schoolData));
localStorage.setItem('school_grade_subjects_v4', JSON.stringify(customSubjectsList));
localStorage.setItem('school_grade_admin_v4', JSON.stringify(adminSettings));
}
async function saveData(syncToBackend = true) {
eachUniqueStudent(student => {
if (!student.gradesByTw) student.gradesByTw = {};
student.gradesByTw[getActiveTw()] = cloneGradeMap(student.grades || {});
});
saveLocalOnly();
const endpoint = SCRIPT_WEB_APP_URL;
adminSettings.scriptUrl = endpoint;
if (!syncToBackend || !endpoint || endpoint === 'https://script.google.com/macros/s/AKfycbzERMBQqxn3Ip68Z4-MiGengma6BCEgOr5bTJuNbos8bYnnV3_SrAEJPyi0Su25FtWh/exec') return;
try {
await fetch(endpoint, {
method: 'POST',
mode: 'no-cors',
headers: { 'Content-Type': 'text/plain;charset=utf-8' },
body: JSON.stringify({
action: 'saveAppData',
schoolData: schoolData,
subjects: customSubjectsList,
settings: Object.assign({}, adminSettings, { scriptUrl: endpoint })
})
});
} catch (err) {
console.error('Gagal mengirim data ke Spreadsheet:', err);
alert('Data tersimpan di perangkat, tetapi pengiriman ke Spreadsheet gagal. Periksa URL Web App.');
}
}
function triggerManualSpreadsheetReload() { fetchSpreadsheetData(true); }
window.onload = function() { fetchSpreadsheetData(true); };
</script>
